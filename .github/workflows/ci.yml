name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - name: Check out upstream asset pack (required by the test suite)
        uses: actions/checkout@v7
        with:
          repository: LiberatedPixelCup/Universal-LPC-Spritesheet-Character-Generator
          path: lpc-generator-src
          depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          LPC_ASSETS_DIR: ${{ github.workspace }}/lpc-generator-src

      - name: Server fails gracefully without assets
        shell: bash
        run: |
          # `bash -e` aborts the step at a failing command, so the exit code has to be
          # captured with `|| code=$?` rather than read from `$?` on the next line.
          code=0
          LPC_ASSETS_DIR=/nonexistent node src/index.js >/dev/null 2>err.log || code=$?
          grep -q "asset pack is not installed" err.log
          test "$code" -eq 1
