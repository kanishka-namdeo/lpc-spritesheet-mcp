name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - name: Check out upstream asset pack (required by the test suite)
        uses: actions/checkout@v7
        with:
          repository: LiberatedPixelCup/Universal-LPC-Spritesheet-Character-Generator
          path: lpc-generator-src
          # checkout@v7 renamed this input; the old `depth` spelling is warned about, not
          # rejected, so a mistake here silently fetches the pack's whole history.
          fetch-depth: 1
          # Pinned: test/golden.json holds SHA-256 hashes of renders made from this pack, and a
          # hash is only a gate if the art behind it is fixed. Bump this together with
          # LPC_ASSETS_PACK_REVISION in .github/AGENTS.md, then re-record with `npm run golden`.
          ref: 9bf06be193b053db256b2536824af426de046aa2

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          LPC_ASSETS_DIR: ${{ github.workspace }}/lpc-generator-src

      - name: Server fails gracefully without assets
        shell: bash
        run: |
          # `bash -e` aborts the step at a failing command, so the exit code has to be
          # captured with `|| code=$?` rather than read from `$?` on the next line.
          code=0
          LPC_ASSETS_DIR=/nonexistent node src/index.js >/dev/null 2>err.log || code=$?
          grep -q "asset pack is not installed" err.log
          test "$code" -eq 1
