    <text x="889" y="571.5" text-anchor="middle" font-size="9.6" font-weight="bold" fill="#161f2b">character.json</text>
    <text x="889" y="585" text-anchor="middle" font-size="8.4" font-weight="normal" fill="#46566b">opt-in</text>
    <rect x="32" y="626" width="300" height="64" rx="7" fill="#eef1f5" stroke="#b6c1cf" stroke-width="1.2"/>
    <text x="42" y="644" text-anchor="start" font-size="9.5" font-weight="bold" fill="#161f2b">Protocol</text>
    <text x="42" y="657.5" text-anchor="start" font-size="8.4" font-weight="normal" fill="#46566b">stdout carries JSON-RPC only; humans read console.error.</text>
    <text x="42" y="670" text-anchor="start" font-size="8.4" font-weight="normal" fill="#46566b">A missing pack fails at startup: stderr block, exit 1.</text>
    <text x="42" y="682.5" text-anchor="start" font-size="8.4" font-weight="normal" fill="#46566b">Tool errors are payloads, never a rejected handler.</text>
    <rect x="344" y="626" width="310" height="64" rx="7" fill="#eef1f5" stroke="#b6c1cf" stroke-width="1.2"/>
    <text x="354" y="644" text-anchor="start" font-size="9.5" font-weight="bold" fill="#161f2b">Licensing</text>
    <text x="354" y="657.5" text-anchor="start" font-size="8.4" font-weight="normal" fill="#46566b">Assets (OGA-BY, CC-BY, CC-BY-SA, GPL) stay in the external</text>
    <text x="354" y="670" text-anchor="start" font-size="8.4" font-weight="normal" fill="#46566b">clone; this code is GPL-3.0-only. Every render ships its</text>
    <text x="354" y="682.5" text-anchor="start" font-size="8.4" font-weight="normal" fill="#46566b">credits files: attribution is a product feature.</text>
    <rect x="666" y="626" width="302" height="64" rx="7" fill="#eef1f5" stroke="#b6c1cf" stroke-width="1.2"/>
    <text x="676" y="644" text-anchor="start" font-size="9.5" font-weight="bold" fill="#161f2b">Universal sheet layout</text>
    <text x="676" y="657.5" text-anchor="start" font-size="8.4" font-weight="normal" fill="#46566b">13 columns × 54 rows of 64 px frames = 832 × 3456,</text>
    <text x="676" y="670" text-anchor="start" font-size="8.4" font-weight="normal" fill="#46566b">15 canonical row blocks behind 17 config keys.</text>
    <text x="676" y="682.5" text-anchor="start" font-size="8.4" font-weight="normal" fill="#46566b">Custom blocks append below row 54 and may widen it.</text>
